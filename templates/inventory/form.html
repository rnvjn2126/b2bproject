{% extends "accounting/base.html" %}
{% block title %}{{ title }} · Steel Quotes{% endblock %}
{% block books %}
<section class="card">
  <p><a href="{% url 'accounting:inventory:overview' %}">Back to inventory</a></p>
  <h1>{{ title }}</h1>
  {% if description %}<p>{{ description }}</p>{% endif %}
  <form method="post"{% if upload %} enctype="multipart/form-data"{% endif %}>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
</section>
{% endblock %}
